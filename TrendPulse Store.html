const reviews=`<section><div class="wrap"><h2 class="reveal">Loved by our customers</h2><div class="rev">${REVIEWS.map(r=>`<div class="rv"><span class="stars">${stars(r.s)}</span><q>${r.t}</q><small>${r.n}, ${r.c}</small></div>`).join("")}</div></div></section>`;
const news=`<section class="news"><div class="wrap reveal"><h2>Get Beauty Updates &amp; Special Offers</h2><p class="sub">Be the first to discover new arrivals, beauty tips and special offers.</p><div class="nf"><input id="em" type="email" placeholder="Your email address" aria-label="Email address"><button class="btn gold" id="sb">Subscribe</button></div></div></section>`;
const home=()=>`<section class="hero"><div class="wrap"><div><h1>Beauty That Makes You Feel Beautiful</h1><p class="sub">Discover carefully selected beauty essentials designed to elevate your everyday self-care routine.</p><div class="cta"><a class="btn" href="#/shop">Shop Now</a><a class="btn ghost" href="#cats">Explore Collection</a><a class="btn wa" data-wa href="#" target="_blank" rel="noopener">Chat With Us on WhatsApp</a></div></div>
<div class="stage" role="img" aria-label="Serum, perfume and body lotion on a blush backdrop">${art("dropper","#e9b7b0")}${art("perfume","#d99a8f")}${art("pump","#e2c39f")}<span class="badge">New arrivals ✨</span></div></div></section>
<section id="cats" style="padding-top:20px"><div class="wrap"><h2 class="reveal">Shop by category</h2><div class="cats">${CATS.map(c=>`<a class="cat reveal" href="#/shop" style="--c:${c[2]}">${art(c[1],c[3])}${c[0]}</a>`).join("")}</div></div></section>
${shop}${about}${why}
<div class="promo reveal"><h2>Your Beauty Routine Deserves a Glow-Up ✨</h2><p>Explore our latest beauty essentials and discover something new for your routine.</p><a class="btn gold" href="#/shop">Shop Collection</a></div>
${reviews}${news}`;
function detail(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return home();let q=1;
setTimeout(()=>{const s=()=>$("#q").textContent=q;$("#mi").onclick=()=>{q=Math.max(1,q-1);s()};$("#pl").onclick=()=>{q++;s()};$("#ad").onclick=()=>add(p.id,q);$("#by").onclick=()=>{add(p.id,q);open(waLink(`Hi TrendPulse Store, I'd like to order ${q} x ${p.name} (${fmt(p.price*q)}).`),"_blank")};$("#wi").href=waLink(`Hi, I have a question about ${p.name}.`)});
return `<div class="wrap"><a class="crumb" href="#/shop">← Back to shop</a><div class="det"><div class="pic" style="--c:${p.bg}" role="img" aria-label="${p.name}">${pimg(p)}</div><div><span class="stars">${stars(p.rating)}</span><h1>${p.name}</h1><div class="price">${fmt(p.price)}</div><p class="sub">${p.long}</p><ul>${p.features.map(f=>`<li>${f}</li>`).join("")}</ul><div class="qty"><button id="mi" aria-label="Decrease">−</button><span id="q">1</span><button id="pl" aria-label="Increase">+</button></div><div class="cta" style="margin-top:20px"><button class="btn" id="ad">Add to Cart</button><button class="btn gold" id="by">Buy Now</button><a class="btn wa" id="wi" target="_blank" rel="noopener">WhatsApp Inquiry</a></div><p class="sub" style="font-size:.8rem;margin-top:18px">Individual results vary. Patch test new products before regular use.</p></div></div></div>
<section><div class="wrap"><h2>You may also like</h2><div class="grid">${PRODUCTS.filter(x=>x.id!==id).slice(0,4).map(card).join("")}</div></div></section>`}
const page=(t,b)=>`<section><div class="wrap" style="max-width:720px"><h1 style="font-size:clamp(2.2rem,5vw,3.4rem)">${t}</h1><p class="sub" style="margin-top:18px">${b}</p></div></section>`;
function route(){const h=location.hash||"#/",a=$("#app");let v;
if(h.startsWith("#/p/"))v=detail(h.slice(4));
else if(h==="#/shop")v=`<div style="padding-top:20px"></div>${shop}${news}`;
else if(h==="#/about")v=about+why;
else if(h==="#/contact")v=page("Contact us","Message us on WhatsApp for orders, product questions or support. We usually reply within a few hours.")+`<div class="wrap" style="max-width:720px;margin-top:-50px"><a class="btn wa" data-wa href="#" target="_blank" rel="noopener">Chat With Us on WhatsApp</a></div>`;
else if(h==="#/privacy")v=page("Privacy Policy","Replace this text with your privacy policy before launch.");
else if(h==="#/terms")v=page("Terms &amp; Conditions","Replace this text with your terms and conditions before launch.");
else v=home();
a.innerHTML=v;$("#lk").classList.remove("on");scrollTo(0,0);
document.querySelectorAll("[data-wa]").forEach(e=>e.href=waLink());
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
a.querySelectorAll(".reveal,.rv").forEach((e,i)=>{e.style.transitionDelay=(i%4)*70+"ms";io.observe(e)});
const sb=$("#sb");if(sb)sb.onclick=()=>{const m=$("#em");if(/^\S+@\S+\.\S+$/.test(m.value)){toast("Subscribed. Thank you!");m.value=""}else toast("Enter a valid email address")}}
addEventListener("hashchange",route);route();
$("#bg").onclick=()=>$("#lk").classList.toggle("on");
$("#cartb").onclick=()=>toast(cart?`${cart} item(s) in your cart`:"Your cart is empty");
addEventListener("scroll",()=>$("#hd").classList.toggle("s",scrollY>10),{passive:true});
$("#yr").textContent=new Date().getFullYear();
</script></body></html>
